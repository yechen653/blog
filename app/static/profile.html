<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN" data-view="showcase">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人介绍</title>
<!--
  个人主页：整个站点的门面（由 FastAPI 在根路径 / 提供，见 app/main.py）。

  【内容与视图分离】本文件只是结构骨架，不含任何展示文案、姓名或链接：
    · 展示数据  → /static/site-config.js（唯一数据源）
    · 填充逻辑  → /static/site.js（按 data-bind / data-rich / data-repeat 挂载）
    · 视觉风格  → /static/swiss.css（骨架与语义色板）
                  /static/starry.css（星月夜主题 + 设置键 + 揭幕演出）
  想改内容改配置，想改风格改本文件 + CSS，两边互不影响。
  site-config.js 在 <head> 同步加载，site.js 在 </body> 前同步执行，
  所以首屏不会闪空白，也没有异步竞态。
-->
<!-- 首帧防白闪：必须在样式生效【之前】同步写好 data-theme。
     外部 theme.js 要等下载执行，那时首帧已经画出来了，会先闪一下白底 Swiss。
     这段是唯一必须内联的脚本，其余逻辑仍走外部文件。 -->
<script>
(function(){try{var t=localStorage.getItem('blog.theme');
if(t==='starry'||t==='swiss')document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<link rel="stylesheet" href="/static/swiss.css?v=20261109-paint1">
<link rel="stylesheet" href="/static/starry.css?v=20261109-paint1">
<script src="/static/site-config.js"></script>
</head>
<body data-page="profile">

<a class="skip-link" href="#main">跳到主内容</a>

<!-- ── 报头 ─────────────────────────────────────────────────── -->
<header class="masthead">
  <div class="masthead-inner">
    <a class="brand" href="/" data-bind="displayName"></a>
    <nav class="nav" aria-label="主导航">
      <a class="nav-link" href="/" aria-current="page" data-bind="nav.profileLabel"></a>
      <a class="nav-link" href="/static/" data-bind="nav.blogLabel"></a>
    </nav>
  </div>
</header>

<!-- ── 头图：超大标题 + 右侧竖线注记 ───────────────────────── -->
<section class="hero">
  <p class="kicker" data-bind="profile.kicker"></p>
  <h1 class="hero-title"><span data-bind="displayName"></span><br><em data-bind="profile.heroSub"></em></h1>
  <p class="hero-meta" data-bind="profile.heroMeta"></p>
</section>

<div class="layout">

  <!-- ── 主栏 ─────────────────────────────────────────────── -->
  <main id="main">
    <h2 class="section-label" data-bind="profile.labels.about"></h2>
    <div class="prose" data-rich="profile.about"></div>

    <h2 class="section-label" style="margin-top:40px" data-bind="profile.labels.stack"></h2>
    <ol class="widget-list" data-repeat="profile.stack" data-template="tpl-stack"></ol>

    <!-- 站外主页：3 列硬分隔线索引。行结构在下方 <template> 里，
         编号 / 名称 / 职能 / 账号 / 地址全部来自配置。 -->
    <h2 class="section-label" style="margin-top:40px" data-bind="profile.labels.links"></h2>
    <p class="section-note" data-bind="profile.linksNote"></p>
    <div class="link-grid" data-repeat="profile.links" data-template="tpl-link"></div>

    <p style="margin-top:32px">
      <a class="widget widget--back" href="/static/"
         data-bind="profile.cta.text" data-bind-attr="href:profile.cta.href"></a>
    </p>
  </main>

  <!-- ── 侧栏 ─────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="widget widget--box">
      <h2 class="widget-label" data-bind="profile.labels.colophon"></h2>
      <p data-bind="profile.siteNote"></p>
    </div>
  </aside>

</div>

<!-- ── 页脚 ─────────────────────────────────────────────────── -->
<footer class="site-footer">
  <div class="footer-word" aria-hidden="true" data-bind-attr="data-word:footerWord.profile"></div>
  <div class="footer-row">
    <p>© <span id="year"></span> <span data-bind="displayName"></span></p>
    <ul class="footer-nav">
      <li><a href="/" data-bind="nav.profileLabel"></a></li>
      <li><a href="/static/" data-bind="nav.blogLabel"></a></li>
    </ul>
  </div>
</footer>

<noscript><p class="wrap">本页内容由站点配置渲染，需要启用 JavaScript。</p></noscript>

<!-- ── 视图模板：结构归 HTML，数据归 site-config.js ─────────── -->
<template id="tpl-stack">
  <li><span class="item"><span data-field="name"></span><span class="count" data-field="note"></span></span></li>
</template>

<template id="tpl-link">
  <a class="link-card" target="_blank" rel="noopener noreferrer" data-field-href="url">
    <span class="link-no" data-field="no"></span>
    <span class="link-name" data-field="name"></span>
    <span class="link-role" data-field="role"></span>
    <span class="link-handle" data-field="handle"></span>
    <span class="link-arrow" aria-hidden="true">↗</span>
  </a>
</template>

<script src="/static/site.js?v=20261109-paint1"></script>

<!-- 主题切换（持久状态）→ 常驻油画层（主题的一部分）→ 三维月面 / 视差层
     → 揭幕演出（一次性事件）。按依赖顺序加载：canvas 在首屏就画好静态画，
     starry-3d 提供球面月与迸发笔触，intro 编排五幕并把月亮接过来。 -->
<script src="/static/theme.js?v=20261109-paint1"></script>
<script src="/static/starry-canvas.js?v=20261109-paint1"></script>
<script src="/static/starry-3d.js?v=20261109-paint1"></script>
<script src="/static/intro.js?v=20261109-paint1"></script>

</body>
</html>
