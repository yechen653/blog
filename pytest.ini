# ============================================================
# pytest 配置：把"怎么跑测试"也集中到一处
#
# 运行（在 blog-api/ 目录下）：
#     pytest                    跑全部
#     pytest -k comment         只跑名字里带 comment 的
#     pytest tests/test_auth.py 只跑一个文件
#     pytest -x                 第一个失败就停
#     pytest --collect-only     只看有哪些测试，不真跑
# ============================================================
[pytest]

# 只在这些目录里找测试。
# 不加的话它会把 migrations/、uploads/ 也翻一遍，浪费时间还可能误收。
testpaths = tests

# 下面是 pytest 的【发现规则】，这三行其实就是默认值，
# 写出来是为了让你知道它们是可以改的：
#     python_files     —— 哪些文件算测试文件
#     python_classes   —— 哪些类算测试类
#     python_functions —— 哪些函数算测试函数
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 把项目根目录（blog-api/）加进 sys.path，
# tests/conftest.py 里的 `import app.xxx` 才找得到。
# （和 alembic.ini 里那句 prepend_sys_path = . 是同一个用意。）
pythonpath = .

# 默认就带上的参数，省得每次手打：
#     -v         每个测试一行，看得见名字（不然屏幕上只有一堆点）
#     --tb=short 失败时只打短回溯，别让几百行调用栈糊满屏幕
addopts = -v --tb=short
